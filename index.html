<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Airoframe Disc Compatibility & Size Finder</title>
  <style>
    :root{
      --text:#0b0f19;
      --muted:#5b6472;
      --border:#e6e8ee;
      --shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
      --radius: 18px;
      --danger:#b42318;
      --ok:#067647;
      --bg1:#f7f8fb;
      --bg2:#ffffff;
      --infoBg:#f0f7ff;
      --infoBorder:#cfe6ff;
      --infoText:#0b3b80;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      padding:20px 15px 40px;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text);
      background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      overflow: hidden; /* Prevent internal scrollbars */
    }

    .wrap{ max-width: 980px; margin:0 auto; }
    header{ margin-bottom:16px; }

    h1{
      font-size: 20px;
      letter-spacing:-0.02em;
      margin:0;
      font-weight: 900;
    }

    .sub{
      margin:8px 0 0;
      color:var(--muted);
      font-size:13px;
      line-height:1.45;
    }

    .card{
      background:#fff;
      border:1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding:18px;
    }

    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    @media (min-width: 600px){
      .grid{ grid-template-columns: 1fr 1fr; }
    }

    label{
      display:block;
      font-weight:800;
      font-size: 11px;
      color: var(--muted);
      margin: 0 0 6px;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    select{
      width: 100%;
      appearance: none;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }

    .infoBubble{
      margin-top: 16px;
      display:none;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--infoBorder);
      background: var(--infoBg);
      color: var(--infoText);
      font-weight: 700;
      font-size: 13px;
    }

    .products{
      display:none;
      grid-template-columns: 1fr;
      gap: 15px;
      margin-top: 18px;
    }

    @media (min-width: 600px){
      .products{ grid-template-columns: 1fr 1fr; }
    }

    .product{
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 15px;
      background: #fff;
    }

    .productTitle{
      margin:0 0 8px;
      font-size: 13px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
    }

    .resultValue{
      font-size: 18px;
      font-weight: 900;
      margin: 0;
    }

    .resultValue.ok{ color: var(--ok); }
    .resultValue.danger{ color: var(--danger); }

    .summary{
      margin-top: 15px;
      font-size: 12px;
      color: var(--muted);
      font-style: italic;
      display:none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Airoframe Finder</h1>
      <p class="sub">Find your disc to confirm compatibility and mount size.</p>
    </header>

    <div class="card">
      <div class="grid">
        <div>
          <label for="manufacturer">Manufacturer</label>
          <select id="manufacturer">
            <option value="">Loading...</option>
          </select>
        </div>
        <div>
          <label for="model">Disc Model</label>
          <select id="model" disabled>
            <option value="">Select Manufacturer</option>
          </select>
        </div>
      </div>

      <div class="infoBubble" id="infoBubble">
        <span id="positiveLine"></span>
      </div>

      <div class="products" id="products">
        <div class="product">
          <p class="productTitle">Custom Mount</p>
          <p class="resultValue" id="mountValue">—</p>
        </div>
        <div class="product">
          <p class="productTitle">Variable Mount</p>
          <p class="resultValue" id="variableValue">—</p>
        </div>
      </div>

      <div class="summary" id="summary"></div>
    </div>
  </div>

<script>
(function(){
  // Element selectors
  const elMfg = document.getElementById('manufacturer');
  const elModel = document.getElementById('model');
  const infoBubble = document.getElementById('infoBubble');
  const positiveLine = document.getElementById('positiveLine');
  const products = document.getElementById('products');
  const elMount = document.getElementById('mountValue');
  const elVariable = document.getElementById('variableValue');
  const summary = document.getElementById('summary');

  let discs = [];
  let byMfg = new Map();
  let current = null;

  // 1. COMMUNICATE WITH SHOPIFY: Send Height
  function sendHeight() {
    setTimeout(() => {
      const height = document.body.scrollHeight;
      window.parent.postMessage({ frameHeight: height }, '*');
    }, 100);
  }

  // 2. COMMUNICATE WITH SHOPIFY: Send Selection
  function sendSelectionToShopify(size) {
    window.parent.postMessage({ selectedSize: size + 'mm' }, '*');
  }

  // Helper functions
  function toNum(v) { return Number.isFinite(Number(v)) ? Number(v) : NaN; }
  
  function isCompatible(d) {
    const inner = toNum(d?.inner_mm);
    const outer = toNum(d?.outer_mm);
    // Logic: Inner must be at least 159mm, Outer no more than 230mm
    return (inner >= 159 && outer <= 230);
  }

  function render() {
    if (!current) {
      infoBubble.style.display = 'none';
      products.style.display = 'none';
      summary.style.display = 'none';
      sendHeight();
      return;
    }

    const compatible = isCompatible(current);
    const size = toNum(current.inner_mm);

    infoBubble.style.display = 'block';
    products.style.display = compatible ? 'grid' : 'none';
    summary.style.display = 'block';

    if (compatible) {
      positiveLine.textContent = "✓ This disc is compatible with Airoframe.";
      elMount.textContent = size + "mm";
      elMount.className = "resultValue ok";
      elVariable.textContent = "Compatible";
      elVariable.className = "resultValue ok";
      summary.textContent = `Recommended Custom Mount Size: ${size}mm`;
      
      // AUTO-SELECT IN SHOPIFY
      sendSelectionToShopify(size);
    } else {
      positiveLine.textContent = "✕ This disc may be incompatible.";
      elMount.textContent = "Incompatible";
      elMount.className = "resultValue danger";
      elVariable.textContent = "Incompatible";
      elVariable.className = "resultValue danger";
      summary.textContent = "This disc size falls outside standard Airoframe ranges.";
    }

    sendHeight();
  }

  // Data Loading & Initialization
  async function init() {
    try {
      const res = await fetch('./discs.json', { cache: 'no-store' });
      discs = await res.json();
      
      byMfg = new Map();
      discs.forEach(d => {
        if(!byMfg.has(d.manufacturer)) byMfg.set(d.manufacturer, []);
        byMfg.get(d.manufacturer).push(d);
      });

      const mfgs = Array.from(byMfg.keys()).sort();
      elMfg.innerHTML = '<option value="">Select Manufacturer...</option>' + 
        mfgs.map(m => `<option value="${m}">${m}</option>`).join('');
      
      sendHeight();
    } catch(e) {
      elMfg.innerHTML = '<option value="">Error Loading Data</option>';
    }
  }

  elMfg.addEventListener('change', () => {
    const list = byMfg.get(elMfg.value) || [];
    elModel.disabled = !elMfg.value;
    elModel.innerHTML = '<option value="">Select Model...</option>' + 
      list.map(d => d.model).sort().map(m => `<option value="${m}">${m}</option>`).join('');
    current = null;
    render();
  });

  elModel.addEventListener('change', () => {
    current = byMfg.get(elMfg.value).find(d => d.model === elModel.value);
    render();
  });

  window.addEventListener('resize', sendHeight);
  init();
})();
</script>
</body>
</html>
