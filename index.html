<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Airoframe Disc Compatibility &amp; Size Finder</title>
  <style>
    :root{
      --text:#0b0f19;
      --muted:#5b6472;
      --border:#e6e8ee;
      --shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
      --radius: 18px;
      --danger:#b42318;
      --ok:#067647;
      --bg1:#f7f8fb;
      --bg2:#ffffff;

      --infoBg:#f0f7ff;
      --infoBorder:#cfe6ff;
      --infoText:#0b3b80;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      padding:28px 18px 48px;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text);
      background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 55%);
    }

    .wrap{ max-width: 980px; margin:0 auto; }
    header{ margin-bottom:16px; }

    h1{
      font-size: 22px;
      letter-spacing:-0.02em;
      margin:0;
      font-weight: 900;
    }

    .sub{
      margin:8px 0 0;
      color:var(--muted);
      font-size:13px;
      line-height:1.45;
      max-width: 76ch;
    }

    .card{
      background:#fff;
      border:1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding:18px;
    }

    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    @media (min-width: 900px){
      .grid{ grid-template-columns: 1fr 1fr; }
      .card{ padding:20px; }
      h1{ font-size: 26px; }
    }

    label{
      display:block;
      font-weight:800;
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 8px;
      letter-spacing: .02em;
      text-transform: uppercase;
    }

    select{
      width: 100%;
      appearance: none;
      padding: 12px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 14px;
      outline: none;
    }

    select:focus{
      box-shadow: 0 0 0 4px rgba(59,130,246,.12);
      border-color:#c9d6ff;
    }

    .infoBubble{
      margin-top: 16px;
      display:none;
      padding: 14px 14px;
      border-radius: 16px;
      border: 1px solid var(--infoBorder);
      background: var(--infoBg);
      color: var(--infoText);
      font-weight: 900;
      font-size: 13px;
      line-height: 1.35;
    }

    .infoBubble .label{
      display:inline-block;
      font-weight: 950;
      letter-spacing: .02em;
      text-transform: uppercase;
      font-size: 11px;
      margin-right: 8px;
      opacity: .9;
    }

    .products{
      display:none;
      grid-template-columns: 1fr;
      gap: 18px;
      margin-top: 18px;
      padding-top: 6px;
    }

    @media (min-width: 900px){
      .products{ grid-template-columns: 1fr 1fr; }
    }

    .product{
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      background: #fff;
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.06);
    }

    .productTitle{
      margin:0;
      font-size: 15px;
      font-weight: 950;
      letter-spacing: -0.01em;
    }

    .resultWrap{
      padding-top: 12px;
      margin-top: 12px;
      border-top: 1px solid var(--border);
    }

    .resultValue{
      font-size: 18px;
      font-weight: 950;
      letter-spacing: -0.02em;
      margin: 0;
      text-align:left;
    }

    .resultValue.danger{ color: var(--danger); }
    .resultValue.ok{ color: var(--ok); }

    .summary{
      margin-top: 14px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
      display:none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Airoframe Disc Compatibility &amp; Size Finder</h1>
      <p class="sub">Select your disc to get the recommended Airoframe product sizes.</p>
    </header>

    <div class="card">
      <div class="grid">
        <div>
          <label for="manufacturer">Manufacturer</label>
          <select id="manufacturer">
            <option value="">Loading…</option>
          </select>
        </div>
        <div>
          <label for="model">Disc Model</label>
          <select id="model" disabled>
            <option value="">Select a manufacturer first</option>
          </select>
        </div>
      </div>

      <div class="infoBubble" id="infoBubble">
        <span class="label">Compatibility</span>
        <span id="positiveLine"></span>
      </div>

      <div class="products" id="products">
        <div class="product" id="mountCard">
          <p class="productTitle">Airoframe Custom Mount</p>
          <div class="resultWrap"><p class="resultValue" id="mountValue">—</p></div>
        </div>

        <div class="product" id="variableCard">
          <p class="productTitle">Airoframe Variable Mount</p>
          <div class="resultWrap"><p class="resultValue" id="variableValue">—</p></div>
        </div>
      </div>

      <div class="summary" id="summary"></div>
    </div>
  </div>

<script>
(function(){
  const elMfg = document.getElementById('manufacturer');
  const elModel = document.getElementById('model');

  const infoBubble = document.getElementById('infoBubble');
  const positiveLine = document.getElementById('positiveLine');
  const summary = document.getElementById('summary');

  const products = document.getElementById('products');
  const mountCard = document.getElementById('mountCard');
  const variableCard = document.getElementById('variableCard');

  const elMount = document.getElementById('mountValue');
  const elVariable = document.getElementById('variableValue');

  const INCOMPAT = 'Disc Selected Is Incompatible';
  const VAR_OK = 'Compatible with Variable Mount';

  let discs = [];
  let byMfg = new Map();
  let current = null;

  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c]));
  }

  function toNum(v){
    const n = Number(v);
    return Number.isFinite(n) ? n : NaN;
  }

  function mountCompatible(d){
    const inner = toNum(d?.inner_mm);
    const outer = toNum(d?.outer_mm);
    return (Number.isFinite(inner) && Number.isFinite(outer) && inner >= 159 && outer <= 230);
  }

  function variableCompatible(d){
    return mountCompatible(d);
  }

  function sendHeightToParent(){
    if (window.parent && window.parent !== window) {
      window.parent.postMessage(
        { frameHeight: document.body.scrollHeight },
        '*'
      );
    }
  }

  function buildManufacturers(){
    const mfgs = Array.from(byMfg.keys()).sort((a,b)=>a.localeCompare(b));
    elMfg.innerHTML = '<option value="">Select…</option>' +
      mfgs.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('');
  }

  function buildModels(mfg){
    if(!mfg){
      elModel.disabled = true;
      elModel.innerHTML = '<option value="">Select a manufacturer first</option>';
      return;
    }

    const list = byMfg.get(mfg) || [];
    const models = list.map(d => d.model).sort((a,b)=>a.localeCompare(b));

    elModel.disabled = false;
    elModel.innerHTML = '<option value="">Select…</option>' +
      models.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('');
  }

  function findDisc(mfg, model){
    return (byMfg.get(mfg) || []).find(d => d.model === model) || null;
  }

  function setResult(el, text, kind){
    el.textContent = text;
    el.classList.remove('danger','ok');
    if(kind) el.classList.add(kind);
  }

  function setInfoBubble(text){
    if(!text){
      infoBubble.style.display = 'none';
      positiveLine.textContent = '';
      return;
    }
    infoBubble.style.display = 'block';
    positiveLine.textContent = text;
  }

  function setSummary(text){
    summary.style.display = text ? 'block' : 'none';
    summary.textContent = text || '';
  }

  function setProductsVisibility(showAny, showMount, showVar){
    products.style.display = showAny ? 'grid' : 'none';
    mountCard.style.display = showMount ? 'block' : 'none';
    variableCard.style.display = showVar ? 'block' : 'none';
  }

  function joinNice(items){
    if(items.length === 0) return '';
    if(items.length === 1) return items[0];
    if(items.length === 2) return items[0] + ' and ' + items[1];
    return items.slice(0, -1).join(', ') + ', and ' + items[items.length - 1];
  }

  function render(){
    if(!current){
      setInfoBubble('');
      setSummary('');
      setProductsVisibility(false, false, false);
      setResult(elMount,'—',null);
      setResult(elVariable,'—',null);
      sendHeightToParent();
      return;
    }

    const mountOK = mountCompatible(current);
    const varOK = variableCompatible(current);

    setProductsVisibility((mountOK || varOK), mountOK, varOK);

    const okProducts = [];
    if(mountOK) okProducts.push('the custom mount');
    if(varOK) okProducts.push('the variable mount');

    setInfoBubble(okProducts.length ? ('Your disc will work with ' + joinNice(okProducts) + '.') : '');

    if(mountOK){
      setResult(elMount, `Size ${toNum(current.inner_mm)}`, 'ok');
    }else{
      setResult(elMount, INCOMPAT, 'danger');
    }

    if(varOK){
      setResult(elVariable, VAR_OK, 'ok');
    }else{
      setResult(elVariable, INCOMPAT, 'danger');
    }

    if(mountOK && varOK){
      setSummary('Summary: Your disc is compatible with the Custom Mount and Variable Mount.');
    }else if(mountOK){
      setSummary('Summary: Your disc is compatible with the Custom Mount only.');
    }else if(varOK){
      setSummary('Summary: Your disc is compatible with the Variable Mount only.');
    }else{
      setSummary('Summary: This disc is not compatible with the available frame mount options.');
    }

    sendHeightToParent();
  }

  async function init(){
    try{
      const res = await fetch('./discs.json', { cache: 'no-store' });
      discs = await res.json();

      byMfg = new Map();
      for(const d of discs){
        if(!byMfg.has(d.manufacturer)) byMfg.set(d.manufacturer, []);
        byMfg.get(d.manufacturer).push(d);
      }

      buildManufacturers();
      buildModels('');
      render();
      sendHeightToParent();
    }catch(e){
      console.error(e);
      elMfg.innerHTML = '<option value="">Error loading data</option>';
      sendHeightToParent();
    }
  }

  elMfg.addEventListener('change', ()=>{
    buildModels(elMfg.value);
    elModel.value = '';
    current = null;
    render();
  });

  elModel.addEventListener('change', ()=>{
    current = (elMfg.value && elModel.value) ? findDisc(elMfg.value, elModel.value) : null;
    render();
  });

  window.addEventListener('load', sendHeightToParent);
  window.addEventListener('resize', sendHeightToParent);

  init();
})();
</script>
</body>
</html>
