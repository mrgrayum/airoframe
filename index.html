<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Airoframe Finder - Clean UI</title>
  <style>
    :root{
      --text:#0b0f19; --muted:#5b6472; --border:#e6e8ee; --shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
      --radius: 18px; --danger:#b42318; --ok:#067647; --bg1:#f7f8fb; --bg2:#ffffff;
      --infoBg:#f0f7ff; --infoBorder:#cfe6ff; --infoText:#0b3b80; --accent: #3b82f6;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0; padding:20px 15px 40px;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text); background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      overflow: hidden; 
    }
    .wrap{ max-width: 980px; margin:0 auto; }
    header{ margin-bottom:16px; }
    h1{ font-size: 20px; letter-spacing:-0.02em; margin:0; font-weight: 900; }
    .sub{ margin:8px 0 0; color:var(--muted); font-size:13px; line-height:1.45; }
    .card{ background:#fff; border:1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding:18px; position: relative; }
    
    label{ display:block; font-weight:800; font-size: 11px; color: var(--muted); margin: 0 0 6px; letter-spacing: .05em; text-transform: uppercase; }
    
    .search-wrap { margin-bottom: 20px; position: relative; }
    .global-search {
      width: 100%; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--border);
      font-size: 15px; outline: none; transition: border-color 0.2s;
    }
    .global-search:focus { border-color: var(--accent); }
    
    .results-list {
      position: absolute; top: 100%; left: 0; right: 0; background: #fff;
      border: 1px solid var(--border); border-radius: 12px; margin-top: 5px;
      max-height: 200px; overflow-y: auto; z-index: 100; box-shadow: var(--shadow);
      display: none;
    }
    .result-item { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid var(--bg1); font-size: 14px; }
    .result-item:hover { background: var(--infoBg); }

    .divider { text-align: center; margin: 15px 0; color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; position: relative; }
    .divider::before, .divider::after { content: ""; position: absolute; top: 50%; width: 40%; height: 1px; background: var(--border); }
    .divider::before { left: 0; } .divider::after { right: 0; }

    .grid{ display:grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 600px){ .grid{ grid-template-columns: 1fr 1fr; } }

    select{ width: 100%; appearance: none; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: #fff; font-size: 14px; cursor: pointer; }

    /* The Success Bubble - Kept Visible */
    .infoBubble{ margin-top: 16px; display:none; padding: 12px; border-radius: 14px; border: 1px solid var(--infoBorder); background: var(--infoBg); color: var(--infoText); font-weight: 700; font-size: 14px; text-align: center; }
    
    /* Technical Boxes - Hidden from UI but active in logic */
    .products, .summary { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Airoframe Finder</h1>
      <p class="sub">Quick search or browse by brand below.</p>
    </header>

    <div class="card">
      <div class="search-wrap">
        <label for="globalSearch">Quick Search</label>
        <input type="text" id="globalSearch" class="global-search" placeholder="Type disc name..." autocomplete="off">
        <div id="resultsList" class="results-list"></div>
      </div>

      <div class="divider">OR BROWSE</div>

      <div class="grid">
        <div>
          <label for="manufacturer">Manufacturer</label>
          <select id="manufacturer"><option value="">Loading...</option></select>
        </div>
        <div>
          <label for="model">Disc Model</label>
          <select id="model" disabled><option value="">Select Manufacturer</option></select>
        </div>
      </div>

      <div class="infoBubble" id="infoBubble"><span id="positiveLine"></span></div>

      <div id="products"></div>
      <div id="summary"></div>
    </div>
  </div>

<script>
(function(){
  const elSearch = document.getElementById('globalSearch');
  const elResults = document.getElementById('resultsList');
  const elMfg = document.getElementById('manufacturer');
  const elModel = document.getElementById('model');
  const infoBubble = document.getElementById('infoBubble');
  const positiveLine = document.getElementById('positiveLine');

  let discs = [];
  let byMfg = new Map();
  let current = null;

  function sendHeight() {
    setTimeout(() => {
      window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
    }, 100);
  }

  function sendSelectionToShopify(disc) {
    if (!disc) return;
    window.parent.postMessage({ 
      selectedSize: disc.inner_mm + 'mm',
      discName: disc.manufacturer + ' ' + disc.model,
      discModel: disc.model 
    }, '*');
  }

  function isCompatible(d) {
    const inner = Number(d?.inner_mm);
    const outer = Number(d?.outer_mm);
    return (inner >= 159 && outer <= 230);
  }

  function render() {
    if (!current) {
      infoBubble.style.display = 'none';
      sendHeight();
      return;
    }

    const compatible = isCompatible(current);
    infoBubble.style.display = 'block';

    if (compatible) {
      positiveLine.textContent = "✓ Compatible with Airoframe™";
      infoBubble.style.background = "#f0f7ff"; // Blueish
      infoBubble.style.borderColor = "#cfe6ff";
      infoBubble.style.color = "#0b3b80";
      
      // Still send data to Shopify even though boxes are hidden
      sendSelectionToShopify(current);
      
    } else {
      positiveLine.textContent = "✕ Disc may be incompatible.";
      infoBubble.style.background = "#fef2f2"; // Reddish
      infoBubble.style.borderColor = "#fee2e2";
      infoBubble.style.color = "#991b1b";
    }
    sendHeight();
  }

  elSearch.addEventListener('input', () => {
    const val = elSearch.value.toLowerCase();
    elResults.innerHTML = '';
    if (val.length < 2) { elResults.style.display = 'none'; sendHeight(); return; }
    const matches = discs.filter(d => d.model.toLowerCase().includes(val) || d.manufacturer.toLowerCase().includes(val)).slice(0, 10);
    if (matches.length > 0) {
      elResults.style.display = 'block';
      matches.forEach(d => {
        const item = document.createElement('div');
        item.className = 'result-item';
        item.innerHTML = `<b>${d.model}</b> <span>${d.manufacturer}</span>`;
        item.onclick = () => {
          current = d;
          elSearch.value = d.model;
          elResults.style.display = 'none';
          elMfg.value = d.manufacturer;
          updateModelDropdown(d.manufacturer);
          elModel.value = d.model;
          render();
        };
        elResults.appendChild(item);
      });
    } else {
      elResults.style.display = 'none';
    }
    sendHeight();
  });

  document.addEventListener('click', (e) => { if (e.target !== elSearch) elResults.style.display = 'none'; });

  function updateModelDropdown(mfg) {
    const list = byMfg.get(mfg) || [];
    elModel.disabled = !mfg;
    elModel.innerHTML = '<option value="">Select Model...</option>' + 
      list.map(d => d.model).sort().map(m => `<option value="${m}">${m}</option>`).join('');
  }

  async function init() {
    try {
      const res = await fetch('./discs.json', { cache: 'no-store' });
      discs = await res.json();
      discs.forEach(d => {
        if(!byMfg.has(d.manufacturer)) byMfg.set(d.manufacturer, []);
        byMfg.get(d.manufacturer).push(d);
      });
      const mfgs = Array.from(byMfg.keys()).sort();
      elMfg.innerHTML = '<option value="">Select Manufacturer...</option>' + 
        mfgs.map(m => `<option value="${m}">${m}</option>`).join('');
      sendHeight();
    } catch(e) { console.error(e); }
  }

  elMfg.addEventListener('change', () => { updateModelDropdown(elMfg.value); elSearch.value = ''; current = null; render(); });
  elModel.addEventListener('change', () => { current = byMfg.get(elMfg.value).find(d => d.model === elModel.value); elSearch.value = current ? current.model : ''; render(); });

  init();
})();
</script>
</body>
</html>
